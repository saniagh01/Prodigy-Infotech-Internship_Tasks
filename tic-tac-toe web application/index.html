
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A modern Tic Tac Toe game built using HTML, CSS and JavaScript">

    <title>Tic Tac Toe | Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background decoration -->
    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <main class="game-container">

        <!-- Header -->
        <header class="game-header">

            <div>
                <p class="eyebrow">CLASSIC GAME</p>

                <h1>
                    Tic <span>Tac</span> Toe
                </h1>

                <p class="subtitle">
                    Think ahead. Make your move. Win the game.
                </p>
            </div>

            <button
                id="themeBtn"
                class="icon-button"
                aria-label="Toggle theme">
                🌙
            </button>

        </header>


        <!-- Game Mode -->
        <section class="mode-section">

            <button
                class="mode-btn active"
                data-mode="ai">
                🤖 VS AI
            </button>

            <button
                class="mode-btn"
                data-mode="pvp">
                👥 2 PLAYERS
            </button>

        </section>


        <!-- Difficulty -->
        <section
            id="difficultySection"
            class="difficulty-section">

            <p>AI DIFFICULTY</p>

            <div class="difficulty-buttons">

                <button
                    class="difficulty-btn"
                    data-difficulty="easy">
                    Easy
                </button>

                <button
                    class="difficulty-btn active"
                    data-difficulty="medium">
                    Medium
                </button>

                <button
                    class="difficulty-btn"
                    data-difficulty="hard">
                    Impossible
                </button>

            </div>

        </section>


        <!-- Scoreboard -->
        <section class="scoreboard">

            <div class="score-card player-card">

                <div class="player-symbol">X</div>

                <div>
                    <p class="player-name">PLAYER</p>
                    <strong id="playerScore">0</strong>
                </div>

            </div>


            <div class="score-card draw-card">

                <div class="player-symbol draw-symbol">=</div>

                <div>
                    <p class="player-name">DRAWS</p>
                    <strong id="drawScore">0</strong>
                </div>

            </div>


            <div class="score-card ai-card">

                <div class="player-symbol">O</div>

                <div>
                    <p class="player-name" id="opponentName">
                        AI
                    </p>

                    <strong id="aiScore">0</strong>
                </div>

            </div>

        </section>


        <!-- Status -->
        <section class="status-section">

            <div
                id="statusIndicator"
                class="status-indicator">
            </div>

            <p id="statusText">
                Your turn — make a move!
            </p>

        </section>


        <!-- Game Board -->
        <section
            id="gameBoard"
            class="game-board"
            aria-label="Tic Tac Toe board">

            <button
                class="cell"
                data-index="0"
                aria-label="Cell 1">
            </button>

            <button
                class="cell"
                data-index="1"
                aria-label="Cell 2">
            </button>

            <button
                class="cell"
                data-index="2"
                aria-label="Cell 3">
            </button>

            <button
                class="cell"
                data-index="3"
                aria-label="Cell 4">
            </button>

            <button
                class="cell"
                data-index="4"
                aria-label="Cell 5">
            </button>

            <button
                class="cell"
                data-index="5"
                aria-label="Cell 6">
            </button>

            <button
                class="cell"
                data-index="6"
                aria-label="Cell 7">
            </button>

            <button
                class="cell"
                data-index="7"
                aria-label="Cell 8">
            </button>

            <button
                class="cell"
                data-index="8"
                aria-label="Cell 9">
            </button>

        </section>


        <!-- Winning message -->
        <section
            id="resultMessage"
            class="result-message hidden">

            <div class="result-icon" id="resultIcon">
                🏆
            </div>

            <h2 id="resultTitle">
                You Win!
            </h2>

            <p id="resultDescription">
                Great move!
            </p>

        </section>


        <!-- Controls -->
        <section class="controls">

            <button
                id="newGameBtn"
                class="primary-btn">
                ↻ New Game
            </button>

            <button
                id="resetScoreBtn"
                class="secondary-btn">
                Reset Score
            </button>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Built with
                <span>HTML</span> •
                <span>CSS</span> •
                <span>JavaScript</span>
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
